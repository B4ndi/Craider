name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Freqtrade (same version as docker-compose.yml)
        run: pip install freqtrade==2026.10 pytest
      - name: Run tests
        run: pytest -q tests
